[project]
name = "git-undo"
version = "0.1.0"
description = "A CLI tool to fix Git mistakes using natural language"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "sahik", email = "mohammadmobassirhoque@gmail.com" }
]
keywords = ["git", "cli", "openai", "undo", "tool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities"
]
dependencies = [
    "typer>=0.12.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.8.0; python_version < '3.13'",
    "google-genai>=1.0.0; python_version >= '3.10'",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
git-undo = "git_undo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
